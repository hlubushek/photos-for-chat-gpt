
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburg Racing Project</title>

    <style>
        body {
            background: #17191d;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        header {
            text-align: center;
            padding: 35px;
            background: #242830;
            border-radius: 12px;
        }

        h1 {
            font-size: 42px;
            text-transform: lowercase;
        }

        .upload {
            margin: 30px auto;
            padding: 20px;
            background: #242830;
            border-radius: 12px;
            max-width: 600px;
            text-align: center;
        }

        input, button {
            padding: 12px;
            margin: 8px;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #e23b35;
            color: white;
            cursor: pointer;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .photo {
            background: #242830;
            padding: 12px;
            border-radius: 10px;
        }

        .photo img {
            width: 100%;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <header>
        <h1>соси сэм альтман</h1>
        <p>Архив строительства гоночной трассы Emergency Hamburg</p>
    </header>

    <section class="upload">
        <h2>Добавить фотографии</h2>

        <input type="text" id="caption"
               placeholder="Описание фотографии">

        <br>

        <input type="file" id="imageInput"
               accept="image/*" multiple>

        <br>

        <button onclick="addImages()">Загрузить</button>
    </section>

    <main id="gallery"></main>

    <script>
        function addImages() {
            const input = document.getElementById("imageInput");
            const caption = document.getElementById("caption").value;
            const gallery = document.getElementById("gallery");

            for (const file of input.files) {
                const reader = new FileReader();

                reader.onload = function(event) {
                    const card = document.createElement("div");
                    card.className = "photo";

                    const img = document.createElement("img");
                    img.src = event.target.result;

                    const text = document.createElement("p");
                    text.textContent = caption || file.name;

                    card.appendChild(img);
                    card.appendChild(text);
                    gallery.appendChild(card);
                };

                reader.readAsDataURL(file);
            }
        }
    </script>

</body>
</html>
